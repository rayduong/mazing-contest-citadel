databases:
  - name: maze-comp-db
    plan: free
    databaseName: mazing_contest
    user: mazing_user

services:
  - type: web
    name: maze-comp
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: maze-comp-db
          property: connectionString
